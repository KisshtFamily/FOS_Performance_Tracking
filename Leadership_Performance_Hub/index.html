<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <title>Early BKT Performance Dashboard</title> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"> <style>:root{--card-bg:rgba(255,255,255,0.85);--card-border:rgba(255,255,255,0.9);--text-primary:#0f172a;--text-secondary:#334155;--text-muted:#64748b;--accent-blue:#1d4ed8;--shadow-sm:0 4px 12px rgba(15,23,42,0.03);--shadow-md:0 10px 30px rgba(100,116,139,0.08);--shadow-lg:0 20px 40px rgba(100,116,139,0.12)}*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{background-color:#f1f3fd;background-image:linear-gradient(135deg,rgba(224,231,255,0.85) 0%,rgba(243,244,246,0.4) 50%,rgba(217,226,254,0.85) 100%),linear-gradient(45deg,rgba(238,242,255,0.8) 0%,rgba(255,255,255,0.5) 50%,rgba(224,231,255,0.8) 100%);background-attachment:fixed;color:var(--text-primary);min-height:100vh;overflow-x:hidden}.dashboard{padding:24px;max-width:1600px;margin:0 auto;zoom:0.90}.top-header{padding:28px 32px;border-radius:24px;background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow-md);margin-bottom:24px;position:relative;z-index:100}.header-top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:16px}.title-box h1{font-size:32px;font-weight:800;color:#1e1b4b;letter-spacing:-0.5px}.title-line{width:140px;height:4px;border-radius:20px;margin-top:8px;background:linear-gradient(90deg,#1d4ed8,#4338ca)}.header-actions{display:flex;gap:12px;align-items:center}.dashboard-date{padding:10px 18px;border-radius:14px;background:#ffffff;border:1px solid #e2e8f0;box-shadow:var(--shadow-sm);font-weight:700;font-size:13px;color:#334155}.download-btn{padding:10px 18px;border-radius:14px;background:#10b981;border:1px solid #059669;color:#ffffff;box-shadow:var(--shadow-sm);font-weight:700;font-size:13px;cursor:pointer;transition:0.25s}.download-btn:hover{background:#059669}.role-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.role-btn{padding:12px 22px;border-radius:14px;border:1px solid #e2e8f0;background:#ffffff;color:var(--text-secondary);font-size:14px;font-weight:600;cursor:pointer;transition:0.25s;box-shadow:var(--shadow-sm)}.role-btn.active{background:var(--accent-blue);color:white;border-color:var(--accent-blue);box-shadow:0 4px 14px rgba(29,78,216,0.3)}.role-btn:hover:not(.active){background:#f8fafc;color:var(--text-primary)}.filter-area{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.search-box{width:280px}.search-box input{width:100%;padding:12px 18px;border-radius:12px;border:1px solid #cbd5e1;background:#ffffff;color:var(--text-primary);outline:none;font-size:14px}.dropdown-group{display:flex;gap:12px;flex-wrap:wrap}.filter-select{min-width:160px;padding:12px 18px;border-radius:12px;border:1px solid #cbd5e1;background:#ffffff;color:var(--text-primary);font-size:14px;font-weight:600;cursor:pointer}.multi-select{position:relative;min-width:160px;z-index:101}.multi-select-btn{width:100%;padding:12px 18px;border-radius:12px;border:1px solid #cbd5e1;background:#ffffff;color:var(--text-primary);font-size:14px;font-weight:600;cursor:pointer;text-align:left;box-shadow:var(--shadow-sm)}.multi-select-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;width:100%;min-width:210px;max-height:260px;overflow:auto;padding:8px;border-radius:14px;background:#ffffff;border:1px solid #e2e8f0;box-shadow:var(--shadow-lg);z-index:9999}.multi-select.open .multi-select-menu{display:block}.multi-option{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-primary);font-size:13px;cursor:pointer}.unit-note{margin-top:16px;display:inline-flex;align-items:center;padding:6px 14px;border-radius:99px;background:#e0e7ff;border:1px solid #c7d2fe;color:#3730a3;font-size:12px;font-weight:700}.hierarchy-filter{display:none;gap:12px;flex-wrap:wrap;width:100%;margin-top:18px;padding-top:18px;border-top:1px solid #e2e8f0}.hierarchy-filter.show{display:flex}.kpi-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:24px}.kpi-card{padding:20px;border-radius:20px;background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(16px);box-shadow:var(--shadow-sm);transition:0.3s ease;position:relative;overflow:hidden}.kpi-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:4px}.kpi-count::before{background:#06b6d4}.kpi-blue::before{background:#2563eb}.kpi-green::before{background:#10b981}.kpi-yellow::before{background:#f59e0b}.kpi-orange::before{background:#f97316}.kpi-purple::before{background:#8b5cf6}.kpi-card h3{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}.kpi-card h2{font-size:26px;font-weight:800;color:var(--text-primary)}.table-section{margin-top:24px;border-radius:20px;background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(16px);box-shadow:var(--shadow-md);overflow-x:auto;padding:12px}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1100px}thead th{padding:16px 14px;font-size:12px;color:var(--text-muted);text-align:center;font-weight:800;text-transform:uppercase;background:rgba(248,250,252,0.8);border-bottom:1px solid #e2e8f0}tbody td{padding:16px 14px;border-bottom:1px solid #f1f5f9;font-size:14px;text-align:center;color:var(--text-secondary)}.case-value{color:#0284c7;font-weight:700}.paid-value{color:#059669;font-weight:700}.red{color:#dc2626;font-weight:700}.percent-wrap{display:flex;align-items:center;justify-content:center;gap:8px}.
